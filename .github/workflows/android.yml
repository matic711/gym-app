name: Android APK

on:
  push:
    branches: [main, claude/fitness-app-dev-foj4jp]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: 1.1.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # Every APK must be signed with the same key, otherwise Android refuses
      # to install it over the existing app (and the app's data would be lost).
      - name: Install signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Manjka secret ANDROID_KEYSTORE_BASE64 (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/app.keystore"
          keytool -list -keystore "$RUNNER_TEMP/app.keystore" -storepass android -alias androiddebugkey > /dev/null
          echo "KEYSTORE_PATH=$RUNNER_TEMP/app.keystore" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Build web bundle
        run: npx esbuild www/js/app.js --bundle --format=esm --outfile=www/js/app.bundle.js --define:__APP_VERSION__=\"$APP_VERSION\"

      - name: Create Android project
        run: |
          npx cap add android
          sed -i -E "s/versionCode [0-9]+/versionCode $VERSION_CODE/; s/versionName \"[^\"]*\"/versionName \"$APP_VERSION\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  app {
                      storeFile file(System.getenv("KEYSTORE_PATH"))
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.app }
              }
          }
          GRADLE
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Verify signature
        run: |
          want=$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | awk '{print $2}')
          got=$(keytool -printcert -jarfile android/app/build/outputs/apk/debug/app-debug.apk | grep -m1 'SHA256:' | awk '{print $2}')
          echo "pričakovan: $want"
          echo "dejanski:   $got"
          if [ -z "$want" ] || [ "$want" != "$got" ]; then
            echo "::error::APK ni podpisan z ključem iz ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gym-app.apk
          gh release create "build-$VERSION_CODE" gym-app.apk \
            --target "$GITHUB_SHA" \
            --title "Gym aplikacija $APP_VERSION" \
            --notes "$(git log -1 --pretty=%B)"
